name: Publish to Hugging Face

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements-api.txt'
      - 'src/**'
      - 'data/**'
      - 'hf/**'
      - '.github/workflows/hf-sync.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Hugging Face client
        run: python -m pip install --upgrade 'huggingface_hub>=1.31,<2'
      - name: Prepare publication folders
        run: |
          mkdir -p .publish/space .publish/model .publish/dataset
          cp app.py requirements-api.txt .publish/space/
          cp hf/space/requirements.txt .publish/space/requirements.txt
          cp -R src .publish/space/src
          cp hf/space/README.md .publish/space/README.md
          cp hf/model/README.md .publish/model/README.md
          cp hf/dataset/README.md .publish/dataset/README.md
          cp data/lead_qualification_eval.jsonl .publish/dataset/
      - name: Validate Space runtime bundle
        run: |
          test -f .publish/space/app.py
          test -f .publish/space/requirements.txt
          test -f .publish/space/requirements-api.txt
          test -f .publish/space/src/__init__.py
          test -f .publish/space/src/models.py
          test -f .publish/space/src/policy.py
          ! grep -q '^-r ' .publish/space/requirements.txt
          ! grep -q '^gradio' .publish/space/requirements.txt
          diff -u <(grep -Ev '^[[:space:]]*(#|$)' requirements-api.txt) <(grep -Ev '^[[:space:]]*(#|$)' .publish/space/requirements.txt)
          python - <<'PY'
          from pathlib import Path
          paths = [Path(".publish/space/app.py"), *Path(".publish/space/src").rglob("*.py")]
          for path in paths:
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
          find .publish/space -type d -name __pycache__ -prune -exec rm -rf {} +
          ! find .publish/space -type f -name '*.pyc' -print -quit | grep -q .
      - name: Validate Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          hf auth whoami
      - name: Publish Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf upload h0000w/autonomous-revenue-ops .publish/space . --repo-type space --token "$HF_TOKEN" --delete-pattern "__pycache__/**"
      - name: Publish dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf upload h0000w/autonomous-revenue-ops .publish/dataset . --repo-type dataset --token "$HF_TOKEN"
      - name: Publish model/system card
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf upload h0000w/autonomous-revenue-ops .publish/model . --repo-type model --token "$HF_TOKEN"
