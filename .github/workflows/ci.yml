name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q src
      - name: Import FastAPI application
        run: python -c "from src.api import app; assert app.title == 'Autonomous Revenue Ops'"
      - name: Run tests
        run: python -m pytest -q
      - name: Run policy benchmark
        run: python evals/benchmark.py
