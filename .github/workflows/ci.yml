name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile application modules and scripts
        run: python -m compileall -q src scripts evals
      - name: Import FastAPI application
        run: python -c "from src.api import app; assert app.title == 'Autonomous Revenue Ops'"
      - name: Run tests
        run: python -m pytest -q
      - name: Run policy benchmark
        run: python evals/benchmark.py
      - name: Run deterministic multi-agent release gate
        run: python evals/agent_release_gate.py --report agent-eval-report.json
      - name: Upload agent evaluation evidence
        if: ${{ always() && hashFiles('agent-eval-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report
          path: agent-eval-report.json
          if-no-files-found: error
      - name: Verify live model evaluation harnesses are opt-in
        run: |
          python evals/live_agent_eval.py openai
          python evals/live_agent_eval.py anthropic
          python evals/live_agent_eval.py gemini
      - name: Verify integration smoke harness is side-effect free by default
        run: |
          python scripts/integration_smoke.py hubspot
          python scripts/integration_smoke.py salesforce
          python scripts/integration_smoke.py slack
          python scripts/integration_smoke.py smtp
      - name: Verify AI provider smoke harness is side-effect free by default
        run: |
          python scripts/ai_provider_smoke.py openai
          python scripts/ai_provider_smoke.py anthropic
          python scripts/ai_provider_smoke.py gemini
      - name: Verify workflow smoke harness is side-effect free by default
        run: python scripts/workflow_smoke.py
      - name: Verify reliability/security smoke harness makes no network calls
        run: python scripts/reliability_smoke.py
      - name: Verify analytics smoke separates measured and scenario evidence
        run: python scripts/analytics_smoke.py
      - name: Validate deployment hardening contract
        run: python scripts/deployment_contract.py
      - name: Verify SLO probe is opt-in by default
        run: python scripts/slo_probe.py
      - name: Validate retained live-evidence contract
        env:
          ARO_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ARO_ENVIRONMENT: test
          ARO_SERVICE_VERSION: 0.10.0
        run: |
          python scripts/live_evidence_contract.py
          python scripts/verify_live_evidence.py live-validation-contract-evidence
      - name: Upload live-evidence contract artifact
        if: ${{ always() && hashFiles('live-validation-contract-evidence/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-validation-contract-evidence
          path: live-validation-contract-evidence/
          if-no-files-found: error
      - name: Validate release version contract
        run: python scripts/release_version_check.py
      - name: Generate and verify release integrity evidence
        env:
          ARO_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/release_evidence.py --output release-evidence
          python scripts/verify_release_evidence.py release-evidence
      - name: Upload release integrity evidence
        if: ${{ always() && hashFiles('release-evidence/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-integrity-evidence
          path: release-evidence/
          if-no-files-found: error
      - name: Build and boot hardened API container
        run: |
          set -euo pipefail
          docker build -t autonomous-revenue-ops:ci .
          docker volume create aro-ci-data >/dev/null
          cleanup() {
            docker rm -f aro-ci >/dev/null 2>&1 || true
            docker volume rm aro-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d \
            --name aro-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount source=aro-ci-data,target=/app/data \
            -p 18000:8000 \
            -e ARO_ENVIRONMENT=test \
            -e ARO_SERVICE_VERSION=0.10.0 \
            -e ARO_DEPLOYMENT_REPLICA_COUNT=1 \
            autonomous-revenue-ops:ci >/dev/null
          test "$(docker inspect --format '{{.Config.User}}' aro-ci)" = "10001:10001"
          python scripts/container_smoke.py --base-url http://127.0.0.1:18000
          docker inspect --format '{{.State.Health.Status}}' aro-ci
