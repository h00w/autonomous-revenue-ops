name: Retained Live Validation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit live validation operation to execute
        required: true
        type: choice
        options:
          - model-smoke-openai
          - model-smoke-anthropic
          - model-smoke-gemini
          - model-eval-openai
          - model-eval-anthropic
          - model-eval-gemini
          - hubspot-smoke
          - salesforce-smoke
          - slack-smoke
          - smtp-smoke
          - deployment-probe
      acknowledge_test_only:
        description: I confirm the configured credentials/target are sandbox, test, or staging resources approved for this validation
        required: true
        type: boolean
      deployment_url:
        description: Required only for deployment-probe, for example https://staging.example.com
        required: false
        type: string
      deployment_label:
        description: Non-sensitive label for the selected deployment
        required: false
        default: staging
        type: string
      deployment_requests:
        description: Observation count for deployment-probe
        required: false
        default: '20'
        type: string

permissions:
  contents: read

env:
  ARO_ENVIRONMENT: staging
  ARO_SERVICE_VERSION: 0.10.0
  ARO_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce manual safety boundary
        env:
          ACK: ${{ inputs.acknowledge_test_only }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Live validation is permitted only from main." >&2
            exit 1
          }
          test "$ACK" = "true" || {
            echo "Sandbox/test/staging acknowledgement is required." >&2
            exit 1
          }

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify exact source before live execution
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ARO_SOURCE_COMMIT"
          python scripts/release_version_check.py
          python scripts/release_evidence.py --output release-evidence --source-commit "$ARO_SOURCE_COMMIT"
          python scripts/verify_release_evidence.py release-evidence

      - name: Execute selected validation and retain evidence
        id: validation
        env:
          OPERATION: ${{ inputs.operation }}
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          DEPLOYMENT_LABEL: ${{ inputs.deployment_label }}
          DEPLOYMENT_REQUESTS: ${{ inputs.deployment_requests }}
          ARO_OPENAI_API_KEY: ${{ secrets.ARO_OPENAI_API_KEY }}
          ARO_ANTHROPIC_API_KEY: ${{ secrets.ARO_ANTHROPIC_API_KEY }}
          ARO_GEMINI_API_KEY: ${{ secrets.ARO_GEMINI_API_KEY }}
          ARO_HUBSPOT_ACCESS_TOKEN: ${{ secrets.ARO_HUBSPOT_ACCESS_TOKEN }}
          ARO_SALESFORCE_INSTANCE_URL: ${{ secrets.ARO_SALESFORCE_INSTANCE_URL }}
          ARO_SALESFORCE_ACCESS_TOKEN: ${{ secrets.ARO_SALESFORCE_ACCESS_TOKEN }}
          ARO_SLACK_WEBHOOK_URL: ${{ secrets.ARO_SLACK_WEBHOOK_URL }}
          ARO_SMTP_HOST: ${{ secrets.ARO_SMTP_HOST }}
          ARO_SMTP_USERNAME: ${{ secrets.ARO_SMTP_USERNAME }}
          ARO_SMTP_PASSWORD: ${{ secrets.ARO_SMTP_PASSWORD }}
          ARO_SMTP_FROM_EMAIL: ${{ secrets.ARO_SMTP_FROM_EMAIL }}
          ARO_SMOKE_EMAIL: ${{ secrets.ARO_SMOKE_EMAIL }}
          ARO_SMOKE_EXTERNAL_KEY: ${{ secrets.ARO_SMOKE_EXTERNAL_KEY }}
        run: |
          set -euo pipefail

          require_var() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret/environment value is missing: $name" >&2
              exit 1
            fi
          }

          SAFE_OPERATION="$(printf '%s' "$OPERATION" | tr -cd 'A-Za-z0-9._-')"
          test -n "$SAFE_OPERATION"
          EVIDENCE_DIR="live-validation-evidence/${GITHUB_RUN_ID}-${SAFE_OPERATION}"
          mkdir -p "$EVIDENCE_DIR"
          echo "evidence_dir=$EVIDENCE_DIR" >> "$GITHUB_OUTPUT"

          case "$OPERATION" in
            model-smoke-openai)
              require_var ARO_OPENAI_API_KEY
              python scripts/ai_provider_smoke.py openai --execute --evidence-dir "$EVIDENCE_DIR"
              ;;
            model-smoke-anthropic)
              require_var ARO_ANTHROPIC_API_KEY
              python scripts/ai_provider_smoke.py anthropic --execute --evidence-dir "$EVIDENCE_DIR"
              ;;
            model-smoke-gemini)
              require_var ARO_GEMINI_API_KEY
              python scripts/ai_provider_smoke.py gemini --execute --evidence-dir "$EVIDENCE_DIR"
              ;;
            model-eval-openai)
              require_var ARO_OPENAI_API_KEY
              python evals/live_agent_eval.py openai --execute --enforce --evidence-dir "$EVIDENCE_DIR"
              ;;
            model-eval-anthropic)
              require_var ARO_ANTHROPIC_API_KEY
              python evals/live_agent_eval.py anthropic --execute --enforce --evidence-dir "$EVIDENCE_DIR"
              ;;
            model-eval-gemini)
              require_var ARO_GEMINI_API_KEY
              python evals/live_agent_eval.py gemini --execute --enforce --evidence-dir "$EVIDENCE_DIR"
              ;;
            hubspot-smoke)
              require_var ARO_HUBSPOT_ACCESS_TOKEN
              require_var ARO_SMOKE_EMAIL
              python scripts/integration_smoke.py hubspot --execute --evidence-dir "$EVIDENCE_DIR"
              ;;
            salesforce-smoke)
              require_var ARO_SALESFORCE_INSTANCE_URL
              require_var ARO_SALESFORCE_ACCESS_TOKEN
              require_var ARO_SMOKE_EMAIL
              python scripts/integration_smoke.py salesforce --execute --evidence-dir "$EVIDENCE_DIR"
              ;;
            slack-smoke)
              require_var ARO_SLACK_WEBHOOK_URL
              python scripts/integration_smoke.py slack --execute --evidence-dir "$EVIDENCE_DIR"
              ;;
            smtp-smoke)
              require_var ARO_SMTP_HOST
              require_var ARO_SMTP_FROM_EMAIL
              require_var ARO_SMOKE_EMAIL
              python scripts/integration_smoke.py smtp --execute --evidence-dir "$EVIDENCE_DIR"
              ;;
            deployment-probe)
              test -n "$DEPLOYMENT_URL" || {
                echo "deployment_url is required for deployment-probe" >&2
                exit 1
              }
              case "$DEPLOYMENT_URL" in
                https://*) ;;
                *) echo "deployment-probe requires an https:// target" >&2; exit 1 ;;
              esac
              case "$DEPLOYMENT_REQUESTS" in
                ''|*[!0-9]*) echo "deployment_requests must be a positive integer" >&2; exit 1 ;;
              esac
              test "$DEPLOYMENT_REQUESTS" -ge 1
              test "$DEPLOYMENT_REQUESTS" -le 1000 || {
                echo "deployment_requests is capped at 1000 per manual run" >&2
                exit 1
              }
              python scripts/slo_probe.py \
                --base-url "$DEPLOYMENT_URL" \
                --target-label "$DEPLOYMENT_LABEL" \
                --requests "$DEPLOYMENT_REQUESTS" \
                --execute \
                --enforce \
                --evidence-dir "$EVIDENCE_DIR"
              ;;
            *)
              echo "Unsupported operation: $OPERATION" >&2
              exit 1
              ;;
          esac

          python scripts/verify_live_evidence.py "$EVIDENCE_DIR"

      - name: Upload retained live-validation evidence
        if: ${{ always() && steps.validation.outputs.evidence_dir != '' && hashFiles(format('{0}/*', steps.validation.outputs.evidence_dir)) != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: live-validation-${{ inputs.operation }}-${{ github.run_id }}
          path: ${{ steps.validation.outputs.evidence_dir }}/
          if-no-files-found: error
          retention-days: 90
