# Render Blueprint for the public n8n orchestration proof surface.
#
# This follows Render's official n8n + Postgres template, but pins n8n to a
# tested stable release instead of using the moving `latest` tag. n8n is only
# an orchestration/client layer; Autonomous Revenue Ops policy and workflow
# authorization remain in the FastAPI service.

services:
  - type: web
    name: autonomous-revenue-ops-n8n
    runtime: image
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    image:
      url: docker.io/n8nio/n8n:2.38.7
    envVars:
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: autonomous-revenue-ops-n8n-db
          property: database
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: autonomous-revenue-ops-n8n-db
          property: host
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: autonomous-revenue-ops-n8n-db
          property: password
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: autonomous-revenue-ops-n8n-db
          property: user
      - key: N8N_HOST
        value: autonomous-revenue-ops-n8n.onrender.com
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_WEBHOOK_URL
        value: https://autonomous-revenue-ops-n8n.onrender.com/
      - key: N8N_EDITOR_BASE_URL
        value: https://autonomous-revenue-ops-n8n.onrender.com/
      - key: N8N_PROXY_HOPS
        value: "1"
      # Render Free has 512 MB RAM. n8n 2.38.x auto-selected a ~256 MB V8 old
      # space and crashed during initial migrations. Raising old space to 384 MB
      # kept the service within the same free instance while allowing startup.
      # If this becomes unstable under workflow load, move to 1c-2g instead of
      # the 0.5c-512mb Starter plan, because Starter has the same RAM as Free.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Explicitly pin upcoming n8n defaults and keep the public demo surface
      # conservative on community packages and decompression limits.
      - key: N8N_UNVERIFIED_PACKAGES_ENABLED
        value: "false"
      - key: N8N_RUNNERS_TASK_TIMEOUT
        value: "60"
      - key: N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES
        value: "268435456"
      - key: N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES
        value: "1000"
      - key: GENERIC_TIMEZONE
        value: Europe/Stockholm
      - key: TZ
        value: Europe/Stockholm

databases:
  - name: autonomous-revenue-ops-n8n-db
    plan: free
    region: frankfurt
